[package]
name = "vframes"
version = "0.1.0"
edition = "2024"
description = "Extract meaningful, timestamped frames from YouTube videos and local files"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
url = "2.5.8"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }
